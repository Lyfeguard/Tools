<!--
  Tools template: Page settings > Custom code > Inside <head> tag.
  Each page loads only its own calculator, named by the item's Component key,
  at the release in the item's Release field. The Release to Webflow workflow
  sets both fields, so this code doesn't change between releases.
  Each {{...}} is a CMS field: delete the placeholder and insert the field
  with "+ Add field". See docs/webflow.md.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Lyfeguard/tools@{{Release}}/dist/v2/{{Component key}}.min.css">
<script src="https://cdn.jsdelivr.net/gh/Lyfeguard/tools@{{Release}}/dist/v2/{{Component key}}.min.js" defer></script>
