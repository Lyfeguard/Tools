name: Sync calculator markup

# Writes each Tools item's Calculator markup field (and Component key) from
# markup/, through the Webflow CMS API, as staged changes: they go live with
# the next publish. Only items that differ are written. Run it after a
# release that changes markup/ (Actions > Sync calculator markup > Run
# workflow), once the template head points at that release.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would change, without writing anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-markup
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync
        run: node scripts/webflow-markup.js sync ${{ inputs.dry_run && '--dry-run' || '' }}
