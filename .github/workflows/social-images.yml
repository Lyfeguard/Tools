name: Calculator social images

# Makes each Tools item's social sharing image (Open Graph, 1200 x 630) from
# its Name and Icon, uploads it to the site's assets and sets the item's
# Social Image field, as a staged change (live at the next publish). Only
# items whose name or icon changed get a new image. Run it after adding a
# calculator or renaming one (Actions > Calculator social images > Run
# workflow); a dry run keeps the images as an artifact to look at first.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Make the images without uploading them (download them from the run's artifacts)
        type: boolean
        default: false
      force:
        description: Remake every image, even if nothing changed (after a design change)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: social-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBFLOW_TOKEN: ${{ secrets.WEBFLOW_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Make, upload and link
        run: node scripts/social-images.js sync ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}
      - name: Keep the dry-run images
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: social-images
          path: out/social/*.png
          retention-days: 7
