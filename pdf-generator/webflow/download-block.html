<!--
  Lyfeguard gated PDF download block — for the Guides (and later Insights) collection templates.

  Designer set-up:
  1. Add a Code Embed inside a styled wrapper on the collection template (suggested spot: after the
     article body, before the FAQs; optionally a slim "Download as PDF" link near the top that scrolls here).
  2. In the embed, replace the {{...}} placeholders with CMS fields using "+ Add Field":
       {{PDF Download}} -> PDF Download (Link field)   {{Name}} -> Name   {{Slug}} -> Slug
  3. Set conditional visibility on the wrapper: show only when "PDF Download" is set.
  4. Replace FORM_ID with the HubSpot form ID (Marketing > Forms > Share > Embed code).
  5. Style the classes below (lg-download*) to the site's design system; the HubSpot form can be styled
     in the form editor (Style tab) to match.

  HubSpot set-up (before going live):
  - Contact properties (single-line text): last_resource_requested, last_resource_url
  - Form "Guide PDF download": Email (required), First name (optional), the two properties as hidden fields,
    plus a marketing consent checkbox. Inline thank-you message: "Thanks, your download is ready."
  - Optional (Marketing Hub Professional+): workflow triggered by this form submission that sends an email
    containing the {{ contact.last_resource_url }} personalisation token.
-->
<div class="lg-download" data-pdf="{{PDF Download}}" data-title="{{Name}}" data-slug="{{Slug}}">
  <div class="lg-download__copy">
    <p class="lg-download__eyebrow">Free PDF</p>
    <h3 class="lg-download__title">Download this guide</h3>
    <p class="lg-download__text">Keep a branded copy to read offline, print or share. Enter your email and it's yours.</p>
  </div>
  <div class="lg-download__form">
    <div class="hs-form-frame" data-region="eu1" data-form-id="FORM_ID" data-portal-id="139576714"></div>
  </div>
  <div class="lg-download__done" hidden>
    <a class="lg-download__button" href="#" target="_blank" rel="noopener">Download the PDF</a>
  </div>
</div>
<script src="https://js-eu1.hsforms.net/forms/embed/139576714.js" defer></script>
<script>
(function () {
  var box = document.querySelector('.lg-download');
  if (!box) return;
  var pdf = box.getAttribute('data-pdf');
  var title = box.getAttribute('data-title');
  var slug = box.getAttribute('data-slug');

  // Tell HubSpot which resource was requested (hidden fields).
  window.addEventListener('hs-form-event:on-ready', function (event) {
    var form = HubSpotFormsV4.getFormFromEvent(event);
    if (!form) return;
    try {
      form.setFieldValue('0-1/last_resource_requested', title);
      form.setFieldValue('0-1/last_resource_url', pdf);
    } catch (e) { /* hidden fields missing from the form: submission still works */ }
  });

  // Reveal the download after a successful submission and log it for GA4 (via GTM).
  window.addEventListener('hs-form-event:on-submission:success', function () {
    var done = box.querySelector('.lg-download__done');
    var link = box.querySelector('.lg-download__button');
    link.href = pdf;
    done.hidden = false;
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'pdf_download', resource_slug: slug, resource_title: title });
  });
})();
</script>
